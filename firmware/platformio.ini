[platformio]
default_envs = n16r8

[env:n16r8]
platform = espressif32@8.0.0
framework = arduino
board = esp32-s3-n16r8
build_src_filter =
    +<*>
    -<adc_voltage_bench_main.cpp>
monitor_speed = 115200
; Keep serial-monitor control lines low; some carrier/reset circuits interpret
; DTR/RTS transitions as reset requests when the monitor opens or closes.
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.35
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_KCONFIG_IGNORE
    -I include

; Focused electrical bring-up: raw ADC codes and calculated A0 voltage only.
; This target intentionally excludes the display and synthetic M01 composition.
[env:n16r8_adc]
extends = env:n16r8
; The bench entry point has no graphics or input dependencies; do not compile
; the inherited M01 libraries into this focused hardware test.
lib_deps =
build_flags =
    -I include
build_src_filter =
    +<adc_voltage_bench_main.cpp>
    +<board/n16r8/arduino_wire_bus.cpp>
    +<measurement/*.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<measurement/*.cpp>
build_flags =
    -std=c++17
    -Ilib/gauge-core/include
    -Isrc
