[platformio]
default_envs = n16r8-lvgl-spike
boards_dir = ../../boards

[env:n16r8-lvgl-spike]
platform = espressif32@8.0.0
framework = arduino
board = esp32-s3-n16r8
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.35
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_KCONFIG_IGNORE
    -I include
