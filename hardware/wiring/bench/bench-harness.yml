tweak:
  append:
  - 'graph [label="W01 - DRAFT / NOT ASSEMBLY READY\nProposed connections; amber blocks/bundles contain unresolved
    interfaces.\nWire colors: W01 convention, NOT factory pigtail evidence. Blank color = complete USB cable; see
    schedule.", labelloc=t, fontsize=18, nodesep=0.35, ranksep=0.7];'
x-w01-views:
  power:
    title: Phase 1 - controller and distribution checks
    cables:
    - W_USB
    - W_RAIL
  display-button:
    title: Phase 2 - display and button / 3.3 V supply
    cables:
    - W_RAIL
    - W_LCD
    - W_LCD_PWR
    - W_BUTTON
  adc:
    title: Phase 3 - ADC power, bus and address
    cables:
    - W_RAIL
    - W_ADC
    - W_ADDR
    - W_I2C_LV
    - W_LS_REF
  pressure:
    title: Phase 4 - RC filter and pressure chain
    cables:
    - W_RAIL
    - W_FTP_PWR
    - W_RAW
    - W_A0
    - W_ANALOG_GND
    - W_ADC
    - W_I2C_LV
    - W_LS_REF
x-w01-status:
  proposed_gpio_question: Q14
  unresolved_questions:
  - Q04
  - Q05
  - Q06
  - Q07
  - Q08
  - Q09
  - Q10
  - Q12
  - Q17
  - Q18
  - Q29
  physical_verification: none
  wire_color: W01 convention for added bench wiring; label and record substitutions; display VCC orange / 3.3 V
  wire_length: measure in mm during layout
  wire_gauge: TBD AWG by current, voltage drop and connector fit
  sensor_terminal_map: GM document 1706435 page 19; adopted pigtail mating-face A/B/C map per P04; as-built check
    pending
  power_design: 'Q30/Q31 selected: native USB, IN-OUT closed, USB-OTG open, L21 5 V feed and L1 3V3 display'
x-w01-color-convention:
  BK:
    name: Black
    use: Ground/return, including ADDR-to-GND strap
  RD:
    name: Red
    use: Nominal USB-fed 5 V supply, shared sensor/ADC branch and translator HV reference; Q30 selected, voltage/load
      checks Q12
  OG:
    name: Orange
    use: 3.3 V supply
  YE:
    name: Yellow
    use: 'Clock: SPI CLK or I2C SCL, identified by bundle/net'
  GN:
    name: Green
    use: 'Data: SPI MOSI or I2C SDA, identified by bundle/net'
  BU:
    name: Blue
    use: Display chip select
  VT:
    name: Violet
    use: Display data/command
  WH:
    name: White
    use: Display reset
  GY:
    name: Gray
    use: Button signal
  BN:
    name: Brown
    use: Raw sensor output, added harness lead only
  PK:
    name: Pink
    use: Conditioned ADC A0 signal
